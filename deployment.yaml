apiVersion: apps/v1
kind: Deployment
metadata:
  name: register-app-pipeline
spec:
  replicas: 3
  selector:
    matchLabels:
      app: register-app
  template:
    metadata:
      labels:
        app: register-app
    spec:
      containers:
        - name: register-app
          image: 905418251757.dkr.ecr.ap-south-1.amazonaws.com/newme-tech:latest
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - containerPort: 8080
